site_name: FASTR Survey Data Fetcher
site_description: Documentation for the FASTR Survey Data Fetcher application
site_author: Claire Boulange / FASTR Analytics
repo_url: https://github.com/FASTR-Analytics/survey-data-fetcher
repo_name: FASTR-Analytics/survey-data-fetcher

copyright: >
  Copyright &copy; 2025 The World Bank, Global Financing Facility for Women,
  Children and Adolescents (GFF), FASTR Initiative. All rights reserved.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FASTR-Analytics/survey-data-fetcher

theme:
  name: material
  icon:
    logo: material/database-sync
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate

extra_css:
  - stylesheets/custom.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Data Sources: data-sources.md
  - Fetching Data: fetching-data.md
  - Cleaning & Processing: cleaning-processing.md
  - Manual Entry: manual-entry.md
  - Data Review: data-review.md
  - Database Integration: database-integration.md
  - Indicator Reference: indicators.md
  - Deployment: deployment.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
