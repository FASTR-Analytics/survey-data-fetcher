site_name: FASTR Survey Data Fetcher
site_description: Documentation for the FASTR Survey Data Fetcher application
site_author: FASTR Analytics

theme:
  name: material
  palette:
    scheme: default
    primary: white
    accent: amber
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - navigation.top

extra_css:
  - stylesheets/custom.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Data Sources: data-sources.md
  - Fetching Data: fetching-data.md
  - Cleaning & Processing: cleaning-processing.md
  - Database Integration: database-integration.md
  - Indicator Reference: indicators.md
  - Deployment: deployment.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
